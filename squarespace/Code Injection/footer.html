<!--
  FOOTER CODE INJECTION
  Paste in: Settings → Advanced → Code Injection → FOOTER
  
  Renders the footer (videos, social links, copyright) into #footer-root
-->

<script>
(function() {
  const footerTemplate = `
<footer class="site-footer" id="mainFooter">
  <h1 class="footer-handle"><a href="https://www.instagram.com/chiefpipettor/" target="_blank">@ChiefPipettor</a></h1>
  <div class="footer-subscribe">
    <h3 class="footer-subscribe-title">Stay in Touch</h3>
    <p class="footer-subscribe-tagline">Get updates on mentorship posts & guest mentors</p>
    <form class="footer-subscribe-form" action="#" method="post">
      <input type="text" name="name" placeholder="Name" class="footer-subscribe-input">
      <input type="email" name="email" placeholder="Email" class="footer-subscribe-input">
      <button type="submit" class="footer-subscribe-btn">Subscribe</button>
    </form>
    <p class="footer-subscribe-status" id="footerSubscribeStatus" aria-live="polite" style="margin-top:10px;font-size:13px;color:#6b6b6b;"></p>
  </div>
  <h3 class="footer-follow">Follow Us</h3>
  <nav class="footer-social social-icons-circle-knockout">
    <a href="https://www.instagram.com/chiefpipettor/" target="_blank" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
    </a>
    <a href="https://www.tiktok.com/@chiefpipettor" target="_blank" aria-label="TikTok">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
    </a>
  </nav>
  <p class="footer-copyright">© The Long Road to Medicine</p>
</footer>
`;
  function renderFooter(containerId) {
    const container = document.getElementById(containerId || 'footer-root');
    if (container) container.innerHTML = footerTemplate;
    wireFooterSubscribeBridge();
  }

  function getNativeSquarespaceNewsletterForm() {
    return document.querySelector(
      'form.newsletter-form, .sqs-block-newsletter form, form[data-form-type="newsletter"], .sqs-block-form form'
    );
  }

  function setStatus(message, isError) {
    const statusEl = document.getElementById('footerSubscribeStatus');
    if (!statusEl) return;
    statusEl.textContent = message || '';
    statusEl.style.color = isError ? '#b00020' : '#6b6b6b';
  }

  function setFieldValue(input, value) {
    if (!input) return;
    input.value = value || '';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function submitViaNativeForm(nativeForm, email, name) {
    // Fill native newsletter fields (support common Squarespace field names/selectors).
    const emailInput =
      nativeForm.querySelector('input[type="email"]') ||
      nativeForm.querySelector('input[name="email"]') ||
      nativeForm.querySelector('input[name*="email" i]');
    const nameInput =
      nativeForm.querySelector('input[name="name"]') ||
      nativeForm.querySelector('input[name="first_name"]') ||
      nativeForm.querySelector('input[type="text"]');

    setFieldValue(emailInput, email);
    if (name) setFieldValue(nameInput, name);

    // Submit in hidden iframe to avoid page navigation while still using native backend flow.
    let iframe = document.getElementById('newsletterBridgeFrame');
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.id = 'newsletterBridgeFrame';
      iframe.name = 'newsletterBridgeFrame';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }

    const oldTarget = nativeForm.getAttribute('target');
    nativeForm.setAttribute('target', 'newsletterBridgeFrame');

    const submitBtn =
      nativeForm.querySelector('button[type="submit"]') ||
      nativeForm.querySelector('input[type="submit"]');

    if (typeof nativeForm.requestSubmit === 'function') {
      nativeForm.requestSubmit(submitBtn || undefined);
    } else if (submitBtn && typeof submitBtn.click === 'function') {
      submitBtn.click();
    } else {
      nativeForm.submit();
    }

    if (oldTarget) nativeForm.setAttribute('target', oldTarget);
    else nativeForm.removeAttribute('target');
  }

  function wireFooterSubscribeBridge() {
    const form = document.querySelector('.footer-subscribe-form');
    if (!form || form.dataset.bound === '1') return;
    form.dataset.bound = '1';

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = form.querySelector('input[name="email"]')?.value?.trim();
      const name = form.querySelector('input[name="name"]')?.value?.trim();
      if (!email) {
        setStatus('Please enter your email first.', true);
        return;
      }

      const nativeForm = getNativeSquarespaceNewsletterForm();
      if (!nativeForm) {
        setStatus('Add one Squarespace Newsletter Block (it can be hidden) and this footer form will auto-connect.', true);
        return;
      }

      const submitBtn = form.querySelector('.footer-subscribe-btn');
      if (submitBtn) submitBtn.disabled = true;
      setStatus('Subscribing...', false);

      try {
        submitViaNativeForm(nativeForm, email, name);
        form.reset();
        setStatus('Thanks! You are subscribed.', false);
      } catch (err) {
        setStatus('Could not subscribe right now. Please try again.', true);
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => renderFooter());
  } else {
    renderFooter();
  }
})();
</script>
