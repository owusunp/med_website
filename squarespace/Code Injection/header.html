<!--
  HEADER CODE INJECTION
  - Hides Squarespace default header
  - Removes section padding
  - Fixes yellow date badge overlap on cards
  - Removes left/right gap on mobile for Code block content
  - Open Graph meta for link preview (iMessage, etc.)
-->
<meta property="og:type" content="website">
<meta property="og:title" content="The Long Road to Medicine">
<meta property="og:description" content="Honest mentorship for future physicians. Unfiltered tips for premeds from seasoned students.">
<meta property="og:image" content="https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=1200&q=80">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="800">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Long Road to Medicine">
<meta name="twitter:description" content="Honest mentorship for future physicians. Unfiltered tips for premeds from seasoned students.">
<meta name="twitter:image" content="https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=1200&q=80">
<style type="text/css">
    /* Hide Squarespace's header only, keep our custom header */
    header:not(.site-header) {
      display: none !important;
    }
    section {
      padding-top: 0 !important;
    }
    .Index-page-content,
    .sqs-block-code,
    .Index-page .Index-page-content,
    [data-section-id] .Index-page-content {
      padding-top: 0 !important;
    }
    .site-container {
      margin-top: 0 !important;
    }
    /* Mobile: remove left/right gap - target Fluid Engine wrappers (content-wrapper, content, fluid-engine) */
    @media (max-width: 768px) {
      .Index-page,
      .Index-page-content,
      .Index-page .Index-page-content,
      [data-section-id],
      [data-section-id] .Index-page-content,
      .content-wrapper,
      .content,
      .content-inner,
      .fluid-engine,
      .fe-block,
      .sqs-code-block,
      .Index-page-content .content-wrapper,
      .Index-page-content .content,
      .Index-page-content .row,
      .Index-page-content .col,
      .row .col,
      .sqs-layout,
      .sqs-layout .sqs-row,
      .sqs-layout .sqs-block,
      .sqs-block,
      .sqs-block-code,
      .sqs-block-code .sqs-block-content,
      .sqs-block-content,
      section[data-section-id],
      .page-section {
        padding-left: 0 !important;
        padding-right: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
      }
    }
    /* Fix: prevent yellow date badge from covering card text */
    .entry-header {
      padding-top: 20px !important;
    }
    .entry-text {
      padding-top: 24px !important;
    }
    .date-callout {
      bottom: -24px !important;
    }
    </style>
